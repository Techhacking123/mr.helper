<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Helper - Secure Payment</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #334155;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            background: #dbeafe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        h1 {
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        p {
            color: #64748b;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .info-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-top: 1rem;
        }

        .info-box p {
            color: #166534;
            margin: 0;
            font-size: 0.875rem;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="icon">📱</div>
        <h1>Use the App to Subscribe</h1>
        <p>Subscriptions are now managed through Google Play Billing directly in the Mr. Helper app.</p>
        <p>Please open the app and go to the <strong>Subscription</strong> page to activate your service account.</p>

        <div class="info-box">
            <p>🔒 Secured by Google Play</p>
        </div>
    </div>

</body>

</html>
